blocks:
  sight:
    title: Wzrok
    info: Zwraca odległość do przeszkody z przodu, po lewej i prawej. Zasięg 10 jednostek. 0.0 - brak przeszkód, 1.0 - przeszkoda bezpośrednio przed.
    port_labels:
      left: Lewa
      front: Przód
      right: Prawa
  invert:
    title: Odwróć
    info: Neguje sygnał wejściowy A, obliczając B = 1.0 - A. Efektywnie odwraca natężenie sygnału.
  compare:
    title: Porównaj
    info: Zwraca 1.0, jeśli sygnał A jest większy od B; w przeciwnym razie zwraca 0.0.
  turn:
    left:
      title: W lewo
      info: Skręć w lewo (wygrywa wyjście, które ma najsilniejszy sygnał).
    right:
      title: W prawo
      info: Skręć w prawo (wygrywa wyjście, które ma najsilniejszy sygnał).
    around:
      title: 180°
      info: Skręć o 180° (wygrywa wyjście, które ma najsilniejszy sygnał).
  go:
    title: Idź
    info: Idź do przodu (wygrywa wyjście, które ma najsilniejszy sygnał).
  dig:
    title: Kop
    info: Uruchamia akcję kopania materii.
  constant:
    title: Stała
    info: Stały sygnał o określonej mocy.
    value_drag: Przeciągnij by zmienić wartość.
  sinus:
    title: Sinus
    info: Sygnał zmienny w czasie (funkcja sinus od czasu).
  noise:
    title: Szum
    info: Zwraca losowy szum.
  wire:
    we:
      info: Połączenie sygnału A do B.
    es:
      info: Połączenie sygnału A do B.
    ws:
      info: Połączenie sygnału A do B.
    wes:
      info: Połączenie sygnału A do B i C.
    ews:
      info: Połączenie sygnału A do B i C.
    cross:
      info: Połączenie sygnału A do B i C do D (mostek).
    cross_joined:
      info: Połączenie sygnału A do B, C i D (łącznik).
  minimum:
    title: Minimum
    info: Zwraca mniejszą z dwóch wartości.
  maximum:
    title: Maksimum
    info: Zwraca większą z dwóch wartości.
  add:
    title: Dodaj
    info: Zwraca sumę sygnałów A i B.
  sub:
    title: Odejmij
    info: Zwraca różnicę sygnałów A i B.
  mul:
    title: Pomnóż
    info: Zwraca wynik mnożenia sygnałów A i B.
  div:
    title: Podziel
    info: Zwraca wynik dzielenia sygnałów A i B.
  modulo:
    title: Reszta
    info: Zwraca resztę dzielenia sygnałów A i B.
  avg:
    title: Średnia
    info: Zwraca średnią sygnałów A i B.
  delay:
    title: Opóźniacz
    info: Przekazuje sygnał na wyjście ze skonfigurowanym opóźnieniem.
  latch:
    title: Pamięć
    info: Utrzymuje na wyjściu stałą wartość 1.0 po otrzymaniu sygnału A, sygnał B zeruje wartość wyjściową. Próg aktywacji: 0.5.
  counter:
    title: Licznik
    info: Kumuluje sygnał wejściowy do osiągnięcia 1.0, po czym wysyła impuls i zeruje stan pamięci (z zachowaniem reszty).
  switch:
    title: Przełącznik
    info: Przekazuje na wyjście sygnał A, gdy wejście CON jest niskie, lub sygnał B, gdy CON przekroczy 0.5.
  edge_detector:
    title: Krawędź
    info: Generuje krótki impuls (1.0), gdy sygnał wejściowy A wzrośnie powyżej poziomu 0.5.
  threshold:
    title: Próg
    info: Ustawia wyjście na 1.0, gdy sygnał przekroczy 0.8, i utrzymuje je do momentu spadku sygnału poniżej 0.2.
  compass:
    title: Kompas
    info: Zwraca sygnał zależny od kierunku. Wyjście A -> EW (0.0=W, 1.0=E, 0.5=N/S). Wyjście B -> NS (0.0=N, 1.0=S, 0.4=E/W).
  clock:
    title: Zegar
    info: Generuje impuls 1.0 co X taktów symulacji.
  moved:
    title: Ruch?
    info: Zwraca 1.0 jeśli w poprzedniej klatce wystąpiła zmiana pozycji jednostki.
  emitter:
    title: Emiter
    info: Wysyła sygnał A lokalnie do Odbiornika na matrycy tego robota.
  receiver:
    title: Odbiornik
    info: Odczytuje lokalny sygnał z Emitera na matrycy tego robota.
  abs:
    title: Abs
    info: Wartość absolutna odejmowania A i B (|A-B|)
  random:
    title: Losowość
    info: Jeśli na wejściu jest > 0.5 losowana jest nowa wartość wyjścia.
  geo:
    title: Geoskan
    info: Skaner złota. Działa na dystansie 2 jednostek przed robotem. Zwraca sygnał w przypadku gdy złoto jest w pobliżu.
  broadcast:
    title: Nadajnik
    info: Rozgłasza sygnał A globalnie do innych robotów przez fale radiowe.
  scanner:
    title: Skaner
    info: Skanuje fale radiowe, by odebrać sygnał od dowolnego robota.
  dish:
    title: Talerz
    info: Skanuje fale radiowe w kierunku obrotu robota, jest to skaner kierunkowy, widzi 90 stopni przed robotem.
  sense:
    title: Zmysł
    info: Zwraca 1.0 jeśli przed robotem jest obiekt danego typu.
  can_dig:
    title: Kopanie?
    info: Czy przed robotem jest materiał, który można wykopać?